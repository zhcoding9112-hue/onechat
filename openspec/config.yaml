schema: spec-driven

context: |
  所有 OpenSpec 产物一律使用简体中文书写。

  产品定位：公会私域收银台（验证期）。10 位公会签约主播，粉丝从直播平台导入自营微信服务号，
  在 H5 内指定主播下单付费（情感倾听/情绪疏导/游戏陪玩）。通话在站外交付，本系统只做
  撮合、收款、结算记账、履约追踪。当期目标是 4 周内测出转化率，不是做规模。

  硬约束：
  - 不承载音视频通话。任何涉及自建实时音视频、内容审核、实名核验的方案一律不采纳。
  - 不做余额钱包。单笔直付；钱包相关字段可预留，但不得开放使用。
  - 支付必须做成可替换抽象：上线期为"人工收款+凭证上传+运营对账"，
    2-3 周后切微信支付 JSAPI，切换不得返工业务逻辑。
  - 价格与分成比例一律后台可配，不得硬编码；分成比例必须在下单瞬间快照写入订单，
    后续调整比例不得影响历史订单分账。
  - 主播端不是独立应用，是同一前端工程里的一个身份态；站内只记账，分成线下月结，不做站内提现。
  - 埋点与转化漏斗数据看板是 P0 交付物，与核心业务功能同等优先级，不得延后。
  - 订单必须有"待接单"状态与超时处置；超时须自动置为已超时、通知双方并进入人工退款队列。

  明确不做（验证期）：榜单、心动墙、礼物与图鉴、盲盒抽奖、优惠券、动态广场、站内 IM、
  试音选人、随机派单、搜索、分区、用户等级、收藏、留言板、公开评价。
  理由：这些功能服务于陌生人撮合，而本产品用户是指名找特定主播，不存在匹配问题。

rules:
  tasks:
    - 每项任务必须带可验证的验收标准，优先给出可执行的验证命令或可观测的判定条件
    - 单项任务粒度控制在 4 小时以内
  proposal:
    - 必须明确写出不在范围内的内容
