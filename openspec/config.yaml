schema: spec-driven

context: |
  所有 OpenSpec 产物一律使用简体中文书写。

  产品定位（2026-11-15 调整）：从「公会私域收银台」转向「陪聊陪玩撮合平台」。
  原定位只服务指名下单，不做发现与匹配；现决定对标陪一，补齐发现、匹配、互动与
  运营玩法，粉丝既可指名下单，也可通过浏览、筛选、随机匹配找到主播。
  通话仍在站外交付，本系统只做撮合、收款、结算记账、履约追踪。

  硬约束：
  - 不承载音视频通话。任何涉及自建实时音视频、内容审核、实名核验的方案一律不采纳。
  - 元子余额「仅记账」：可展示余额与流水，由运营手工发放与调整；
    不开放用户充值入口，不开放提现。真实充值涉及预付资金沉淀，另案决策。
  - 支付必须做成可替换抽象：当前为「人工收款+凭证上传+运营对账」，
    后续切微信支付 JSAPI，切换不得返工业务逻辑。
  - 价格与分成比例一律后台可配，不得硬编码；分成比例必须在下单瞬间快照写入订单，
    后续调整比例不得影响历史订单分账。
  - 主播端不是独立应用，是同一前端工程里的一个身份态；站内只记账，分成线下月结，不做站内提现。
  - 埋点与转化漏斗数据看板是 P0 交付物，不得延后。新增入口（盲盒、心动墙、榜单、
    动态广场）必须各自带埋点，否则无法判断哪个入口真正带来成交。
  - 订单必须有「待接单」状态与超时处置；超时须自动置为已超时、通知双方并进入人工退款队列。
  - 主播资料中的宣传语标签、简介、封面图一律为运营/主播自填内容，系统只提供字段与
    审核开关，不内置任何营销文案模板，不提供封面图烧字功能。
  - 2026-11-22 用户更新素材规则：允许参考或复制竞品素材，须登记实际来源；主播头像可暂用生成插画，动态翅膀必须实现。

  明确不做（本阶段）：
  - 电竞独立业务模型暂不引入。2026-11-22 视觉复刻保留电竞切换入口，按已有服务目录分类；未配置时显示空状态，不伪造服务。
  - 用户充值与提现。
  - 自建音视频通话。

rules:
  tasks:
    - 每项任务必须带可验证的验收标准，优先给出可执行的验证命令或可观测的判定条件
    - 单项任务粒度控制在 4 小时以内
  proposal:
    - 必须明确写出不在范围内的内容
