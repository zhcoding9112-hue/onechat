server:
  port: 8080
  servlet:
    session:
      cookie:
        name: PCSESSION
        http-only: true
        same-site: lax
        # 生产走 HTTPS 时置为 true，本机 http 调试保持 false 否则 Cookie 不下发。
        secure: ${SESSION_COOKIE_SECURE:false}
        path: /

spring:
  application:
    name: private-checkout

  profiles:
    # 本机开发必须显式指定 local（授权桩只在 local/test/dev 下允许启用）。
    # 生产环境用 SPRING_PROFILES_ACTIVE=prod 覆盖，届时必须配齐微信 AppID/AppSecret。
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:private_checkout}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 1

  session:
    # 会话存 Redis：应用重启不掉线，且为后续多实例留好余地。
    store-type: redis
    # 会话有效期。每次访问都会续期（见 SessionConfig 的 flush-mode 说明）。
    timeout: ${SESSION_TIMEOUT:7d}
    redis:
      namespace: private-checkout:session
      flush-mode: on-save
      repository-type: default

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

storage:
  # 本地存储根目录。上线接对象存储时换 FileStorage 实现即可，业务侧不动。
  root-dir: ${STORAGE_ROOT:./uploads}
  public-prefix: ${STORAGE_PUBLIC_PREFIX:/uploads}

wechat:
  oauth:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    scope: ${WECHAT_OAUTH_SCOPE:snsapi_userinfo}
    callback-base-url: ${APP_BASE_URL:http://127.0.0.1:5173}
    state-ttl-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    db:
      enabled: true
